name: Versioned review artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build:
    uses: ./.github/workflows/native-builds.yml
    with:
      release: true
  draft:
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dart run tool/verify_release.dart "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Hash artifacts
        run: |
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "DoUrStuff $RELEASE_TAG — unsigned review artifacts" --notes-file .github/RELEASE_TEMPLATE.md artifacts/android-unsigned-release/*.apk artifacts/windows-unpackaged-release/*.zip artifacts/SHA256SUMS.txt
